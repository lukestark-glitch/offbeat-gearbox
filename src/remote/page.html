<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffa31a">
<title>Gearbox Remote</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--a:#ffa31a;--bg:#0d0804;--tx:#fff1e0;--pn:#1a1109;--dim:rgba(255,163,26,.28);--bd:rgba(255,163,26,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden;
  font:600 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{display:flex;flex-direction:column;gap:8px;padding:10px 12px;
  padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));
  background:radial-gradient(ellipse at 50% 0,#2a1706 0,var(--bg) 70%)}
.bar{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:16px;letter-spacing:.3em;color:var(--a);text-shadow:0 0 12px var(--a);flex:1}
.lbl{text-transform:uppercase;letter-spacing:.14em;font-size:11px;opacity:.8}
button{font:inherit;color:var(--tx);text-transform:uppercase;letter-spacing:.12em;background:var(--pn);
  border:1px solid var(--bd);border-radius:10px;min-width:44px;min-height:44px;padding:0 12px;touch-action:manipulation}
button:active{background:#3a2208}
button.on{background:var(--a);color:#1a0d00;border-color:var(--a);box-shadow:0 0 16px var(--a)}
button:disabled{opacity:.25}
.disp{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:84px;min-height:44px;
  padding:2px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--pn)}
.disp b{font-size:20px;color:var(--a);text-shadow:0 0 8px var(--a);font-variant-numeric:tabular-nums}
#dot{width:14px;height:14px;border-radius:50%;background:#553;box-shadow:none}
#dot.ok{background:#4f8;box-shadow:0 0 10px #4f8}
#dot.bad{background:#f44;box-shadow:0 0 10px #f44}
#play{min-width:110px;font-size:15px}
#pats{display:flex;gap:6px;flex:1}
#pats button{flex:1;font-size:18px;min-height:48px}
#pats button.r{animation:bl .5s steps(2) infinite;outline:2px solid var(--a);outline-offset:-3px}
@keyframes bl{50%{background:#4a2a08}}
#pages{display:flex;gap:6px}
#fill{min-width:96px;min-height:48px;font-size:15px}
#grid{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;padding:8px;border:1px solid var(--bd);border-radius:14px;background:rgba(26,17,9,.7)}
.row{flex:1;display:flex;align-items:stretch;gap:6px;min-height:44px}
.row .nm{width:96px;display:flex;align-items:center;text-transform:uppercase;letter-spacing:.14em;font-size:12px;overflow:hidden;white-space:nowrap}
.row button{padding:0;min-width:44px}
.row .ln{width:34px;display:flex;align-items:center;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums;color:var(--a)}
.cells{flex:1;display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.c{position:relative;border:1px solid var(--bd);border-radius:7px;background:#120b05;min-width:0;touch-action:manipulation}
.c:nth-child(4n+1):not(:first-child){margin-left:6px}
.c.g{background:rgba(255,163,26,.3);border-color:rgba(255,163,26,.5)}
.c.x{background:rgba(255,163,26,.7);border-color:var(--a);box-shadow:0 0 6px rgba(255,163,26,.5)}
.c.X{background:var(--a);border-color:#ffd089;box-shadow:0 0 16px var(--a),0 0 4px #fff inset}
.c.t::after{content:"";position:absolute;right:-8px;top:42%;height:16%;width:10px;background:var(--a);
  box-shadow:0 0 6px var(--a);border-radius:2px;z-index:2}
.c{display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:0;white-space:nowrap;overflow:hidden;color:var(--tx)}
.c.g,.c.x,.c.X{color:#1a0d00}
.c.cur{outline:2px solid #fff1e0;outline-offset:1px;box-shadow:0 0 14px #fff1e0}
.c.off{opacity:.15;pointer-events:none}
#pin{position:fixed;inset:0;background:rgba(13,8,4,.96);display:none;align-items:center;justify-content:center;z-index:9}
#pin.show{display:flex}
#pin .box{width:320px;padding:20px;border:1px solid var(--a);border-radius:18px;background:var(--pn);box-shadow:0 0 30px rgba(255,163,26,.3);text-align:center}
#pin input{width:100%;font-size:34px;text-align:center;letter-spacing:.5em;background:#0d0804;color:var(--a);
  border:1px solid var(--bd);border-radius:10px;padding:8px;margin:10px 0;min-height:56px}
#pin .err{color:#f66;min-height:18px}
#roll{flex:1;display:none;flex-direction:column;gap:6px;min-height:0;padding:8px;border:1px solid var(--bd);border-radius:14px;background:rgba(26,17,9,.7)}
#roll.show{display:flex}
#roll .bar{flex:none}
#roll h2{margin:0;flex:1;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--a)}
#rb{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:3px}
.rr{flex:none;height:32px;display:flex;align-items:stretch;gap:6px}
.rr .rn{width:56px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:11px;font-variant-numeric:tabular-nums;border-radius:6px;background:#120b05}
.rr .rn.b{background:#0a0603;opacity:.85}
.rr .rn.cc{color:var(--a)}
.c.b{background:#080502}
#roll .c.t::after{right:2px;width:40%;top:40%;height:20%}
#keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#keys button{min-height:56px;font-size:22px}
</style>
</head>
<body>
<!-- Kopfzeile -->
<div class="bar">
  <h1>GEARBOX REMOTE</h1>
  <button id="vel">Stärke</button>
  <button id="play">Play</button>
  <div class="disp"><span class="lbl">BPM</span><b id="bpm">--</b></div>
  <div class="disp"><span class="lbl">Swing</span><b id="swing">--</b></div>
  <span id="dot" title="Verbindung"></span><span class="lbl" id="dotl">getrennt</span>
</div>
<!-- Pattern-Leiste, Fill, Seitenwahl -->
<div class="bar">
  <div id="pats"></div>
  <button id="fill">Fill</button>
  <span class="lbl">Seite</span>
  <div id="pages"></div>
</div>
<div id="grid"></div>
<!-- Piano-Roll -->
<div id="roll"></div>
<!-- PIN-Dialog -->
<div id="pin"><div class="box">
  <div class="lbl">PIN eingeben</div>
  <input id="pinin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" readonly>
  <div class="err" id="pinerr"></div>
  <div id="keys"></div>
</div></div>
<script>
"use strict";
// ---------- Zustand ----------
var LP = 450;                       // Long-Press-Dauer in ms
var model = null;                   // letzter "state" vom Server (lokal optimistisch verändert)
var live = {playing:false,bpm:0,pattern:0,queued:0,steps:[],mutes:[],swing:0,fill:false};
var page = 0;                       // sichtbare Seite 0..3
var pin = "", es = null, opened = false, dirty = false;
var CH = ".gxX";                    // Zeichen je Velocity 0..3
var CYCLE = [2,0,3,1];
var velMode = store("gearboxVelMode")==="1"; // Stärke-Modus: Tippen durchläuft alle Velocities
var NN = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var roll = -1, rollView = 0;   // Piano-Roll: Spur (-1 = Raster) und unterster Offset der Ansicht

function $(id){return document.getElementById(id);}
function store(k,v){try{if(v===null)localStorage.removeItem(k);else if(v!==undefined)localStorage.setItem(k,v);else return localStorage.getItem(k);}catch(e){}return null;}
function el(tag,cls,txt,par){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(par)par.appendChild(e);return e;}
function setChar(s,i,c){return s.substr(0,i)+c+s.substr(i+1);}
function curTrack(t){return model&&model.patterns[live.queued]?model.patterns[live.queued].tracks[t]:null;}

// ---------- Netzwerk ----------
function send(lines){
  if(!Array.isArray(lines))lines=[lines];
  fetch("/cmd?pin="+pin,{method:"POST",headers:{"Content-Type":"text/plain"},body:lines.join("\n")})
    .then(function(r){if(r.status===403)askPin("PIN falsch");}).catch(function(){});
}
function connect(){
  if(es)es.close();
  opened=false;
  es=new EventSource("/events?pin="+pin);
  es.onopen=function(){opened=true;status(true);};
  es.addEventListener("state",function(e){try{model=JSON.parse(e.data);dirty=true;draw();}catch(x){}});
  es.addEventListener("live",function(e){try{live=JSON.parse(e.data);status(true);dirty=true;draw();}catch(x){}});
  es.onerror=function(){
    status(false);
    if(!opened||es.readyState===2){ // keine Verbindung: PIN prüfen
      fetch("/state?pin="+pin).then(function(r){
        if(r.status===403){es.close();askPin("PIN falsch");}
        else if(es.readyState===2)setTimeout(connect,3000);
      }).catch(function(){if(es.readyState===2)setTimeout(connect,3000);});
    }
  };
}
function status(ok){$("dot").className=ok?"ok":"bad";$("dotl").textContent=ok?"verbunden":"getrennt";}

// ---------- PIN-Dialog ----------
function askPin(msg){
  pin="";store("gearboxPin",null);
  if(es){es.close();es=null;}
  status(false);
  $("pinin").value="";$("pinerr").textContent=msg||"";$("pin").className="show";
}
function pinKey(k){
  var inp=$("pinin");
  if(k==="C")inp.value="";
  else if(k==="<")inp.value=inp.value.slice(0,-1);
  else if(inp.value.length<4)inp.value+=k;
  if(inp.value.length===4){
    pin=inp.value;store("gearboxPin",pin);
    $("pin").className="";connect();
  }
}
["1","2","3","4","5","6","7","8","9","C","0","<"].forEach(function(k){
  var b=el("button","",k==="<"?"⌫":k,$("keys"));
  b.onclick=function(){pinKey(k);};
});

// ---------- DOM einmalig aufbauen ----------
var cells=[],cellCache=[],rows=[];
var pb=[];
"ABCDEFGH".split("").forEach(function(n,p){
  var b=el("button","",n,$("pats"));
  b.onclick=function(){live.queued=p;send("pattern "+p);dirty=true;draw();};
  pb.push(b);
});
var pgb=[];
[0,1,2,3].forEach(function(i){
  var b=el("button","",String(i+1),$("pages"));
  b.onclick=function(){page=i;dirty=true;draw();};
  pgb.push(b);
});
function mkBtn(par,txt,fn){var b=el("button","",txt,par);b.onclick=fn;return b;}

for(var t=0;t<8;t++)(function(t){
  var r=el("div","row","",$("grid"));
  var nm=el("div","nm","",r);
  nm.onclick=function(){if(model&&model.tracks[t]&&model.tracks[t].melody)openRoll(t);};
  var mb=mkBtn(r,"M",function(){var v=live.mutes[t]?0:1;live.mutes[t]=v;send("mute "+t+" "+v);dirty=true;draw();});
  var sb=mkBtn(r,"S",function(){var tr=model.tracks[t];tr.solo=!tr.solo;send("solo "+t+" "+(tr.solo?1:0));dirty=true;draw();});
  var cw=el("div","cells","",r);
  for(var i=0;i<16;i++)(function(i){
    var c=el("div","c","",cw);
    cells.push(c);cellCache.push("");
    var timer=null,fired=false;
    function clear(){if(timer){clearTimeout(timer);timer=null;}}
    c.addEventListener("pointerdown",function(e){
      e.preventDefault();fired=false;clear();
      timer=setTimeout(function(){timer=null;fired=true;tie(t,page*16+i);},LP); // Long-Press: Tie
    });
    c.addEventListener("pointerup",function(){
      if(timer){clear();if(!fired)tap(t,page*16+i);}
    });
    c.addEventListener("pointercancel",clear);
    c.addEventListener("pointerleave",clear);
    c.addEventListener("contextmenu",function(e){e.preventDefault();});
  })(i);
  var ln=el("div","ln","",r);
  var lm=mkBtn(r,"−",function(){setLen(t,-1);});
  var lp=mkBtn(r,"+",function(){setLen(t,1);});
  var rl=mkBtn(r,"◀",function(){rot(t,-1);});
  var rr=mkBtn(r,"▶",function(){rot(t,1);});
  rows.push({nm:nm,mb:mb,sb:sb,ln:ln});
})(t);

// ---------- Aktionen (optimistisch) ----------
function cycle(t,s){
  var tr=curTrack(t);if(!tr||s>=tr.length)return;
  var v=CH.indexOf(tr.steps.charAt(s));if(v<0)v=0;
  v=CYCLE[v];
  tr.steps=setChar(tr.steps,s,CH.charAt(v));
  send("step "+live.queued+" "+t+" "+s+" "+v);
  dirty=true;draw();
}
function tap(t,s){
  var tr=curTrack(t);if(!tr||s>=tr.length)return;
  if(velMode){cycle(t,s);return;}
  var v=CH.indexOf(tr.steps.charAt(s));if(v<0)v=0;
  v=v?0:2;
  tr.steps=setChar(tr.steps,s,CH.charAt(v));
  send("step "+live.queued+" "+t+" "+s+" "+v);
  dirty=true;draw();
}
function noteName(n){return NN[((n%12)+12)%12]+(Math.floor(n/12)-1);}
function stepKeys(tr,s){ // Offsets eines Schritts (ohne Eintrag: Grundton)
  var k=tr.keys&&tr.keys[s];
  return k&&k.length?k:[0];
}
function tie(t,s){
  var tr=curTrack(t);if(!tr||s>=tr.length)return;
  var on=tr.ties.charAt(s)==="~"?0:1;
  tr.ties=setChar(tr.ties,s,on?"~":".");
  send("tie "+live.queued+" "+t+" "+s+" "+on);
  dirty=true;draw();
}
function setLen(t,d){
  var tr=curTrack(t);if(!tr)return;
  var n=Math.max(1,Math.min(64,tr.length+d));
  if(n===tr.length)return;
  tr.length=n;
  send("length "+live.queued+" "+t+" "+n);
  dirty=true;draw();
}
function rot(t,d){
  var tr=curTrack(t);if(!tr)return;
  var L=tr.length;
  function rr(s){ // Teil bis length rotieren, Rest unverändert
    var h=s.substr(0,L),o="";
    for(var i=0;i<L;i++)o+=h.charAt((i-d+L)%L);
    return o+s.substr(L);
  }
  tr.steps=rr(tr.steps);tr.ties=rr(tr.ties);
  send("rotate "+live.queued+" "+t+" "+d);
  dirty=true;draw();
}
// ---------- Piano-Roll ----------
var rollCells=[],rollCache=[],rollLbl=[],rollInit=false,rollTitle,rollM,rollS;
var BLACK=[1,3,6,8,10];
function openRoll(t){
  var note=model.tracks[t].note||0;
  roll=t;rollView=Math.max(-24,Math.min(0,-(note%12)));
  rollCache=[];dirty=true;draw();
}
function closeRoll(){roll=-1;dirty=true;draw();}
function shiftRoll(d){
  var v=Math.max(-24,Math.min(0,rollView+d));
  if(v===rollView)return;
  rollView=v;rollCache=[];dirty=true;draw();
}
function rollTap(t,s,o){
  var tr=curTrack(t);if(!tr||s>=tr.length)return;
  var v=CH.indexOf(tr.steps.charAt(s));if(v<0)v=0;
  var ks=stepKeys(tr,s).slice(),i=ks.indexOf(o),P=live.queued;
  if(velMode&&v>0&&i>=0){cycle(t,s);return;}
  if(!tr.keys)tr.keys={};
  if(v===0){ // Schritt war aus: nur dieser Offset
    tr.steps=setChar(tr.steps,s,CH.charAt(2));
    if(o===0)delete tr.keys[s];else tr.keys[s]=[o];
    send(["step "+P+" "+t+" "+s+" 2","keys "+P+" "+t+" "+s+(o===0?"":" "+o)]);
    dirty=true;draw();return;
  }
  if(i>=0)ks.splice(i,1);else ks.push(o);
  ks.sort(function(a,b){return a-b;});
  if(!ks.length){
    delete tr.keys[s];
    tr.steps=setChar(tr.steps,s,".");
    send(["step "+P+" "+t+" "+s+" 0","keys "+P+" "+t+" "+s]);
  }else if(ks.length===1&&ks[0]===0){
    delete tr.keys[s];
    send("keys "+P+" "+t+" "+s);
  }else{
    tr.keys[s]=ks;
    send("keys "+P+" "+t+" "+s+" "+ks.join(","));
  }
  dirty=true;draw();
}
function buildRoll(){
  rollInit=true;
  var R=$("roll"),hd=el("div","bar","",R);
  rollTitle=el("h2","","",hd);
  rollM=mkBtn(hd,"M",function(){if(roll<0)return;var v=live.mutes[roll]?0:1;live.mutes[roll]=v;send("mute "+roll+" "+v);dirty=true;draw();});
  rollS=mkBtn(hd,"S",function(){if(roll<0)return;var tr=model.tracks[roll];tr.solo=!tr.solo;send("solo "+roll+" "+(tr.solo?1:0));dirty=true;draw();});
  mkBtn(hd,"OKT −",function(){shiftRoll(-12);});
  mkBtn(hd,"OKT +",function(){shiftRoll(12);});
  mkBtn(hd,"Raster",closeRoll);
  var body=el("div","","",R);body.id="rb";
  for(var r=0;r<24;r++)(function(r){
    var row=el("div","rr","",body);
    rollLbl.push(el("div","rn","",row));
    var cw=el("div","cells","",row);
    for(var i=0;i<16;i++)(function(i){
      var c=el("div","c","",cw);
      rollCells.push(c);rollCache.push("");
      var timer=null,fired=false;
      function clear(){if(timer){clearTimeout(timer);timer=null;}}
      c.addEventListener("pointerdown",function(e){
        e.preventDefault();fired=false;clear();
        timer=setTimeout(function(){
          timer=null;fired=true;
          var tr=curTrack(roll),s=page*16+i;
          if(tr&&s<tr.length&&c.classList.contains("lit"))tie(roll,s); // Long-Press auf leuchtender Zelle: Tie
        },LP);
      });
      c.addEventListener("pointerup",function(){
        if(timer){clear();if(!fired)rollTap(roll,page*16+i,rollView+23-r);}
      });
      c.addEventListener("pointercancel",clear);
      c.addEventListener("pointerleave",clear);
      c.addEventListener("contextmenu",function(e){e.preventDefault();});
    })(i);
  })(r);
}
function renderRoll(){
  var t=roll,tr=curTrack(t),info=model.tracks[t];
  if(!tr)return;
  var note=info.note||0,cur=live.steps[t]!==undefined?live.steps[t]:-1,r,i;
  rollTitle.textContent=info.name+" · PIANO-ROLL";
  rollM.classList.toggle("on",!!live.mutes[t]);
  rollS.classList.toggle("on",!!info.solo);
  for(r=0;r<24;r++){
    var o=rollView+23-r,n=note+o,pc=((n%12)+12)%12,blk=BLACK.indexOf(pc)>=0;
    var lc="rn"+(blk?" b":"")+(pc===0?" cc":"");
    if(rollLbl[r].className!==lc)rollLbl[r].className=lc;
    var nn=noteName(n);
    if(rollLbl[r].textContent!==nn)rollLbl[r].textContent=nn;
    for(i=0;i<16;i++){
      var s=page*16+i,cls="c";
      if(s>=tr.length)cls+=" off";
      else{
        var ch=tr.steps.charAt(s),lit=false;
        if(ch==="g"||ch==="x"||ch==="X")lit=stepKeys(tr,s).indexOf(o)>=0;
        if(lit){cls+=" "+ch+" lit";if(tr.ties.charAt(s)==="~")cls+=" t";}
        else if(blk)cls+=" b";
        if(live.playing&&live.pattern===live.queued&&s===cur)cls+=" cur";
      }
      var k=r*16+i;
      if(rollCache[k]!==cls){rollCache[k]=cls;rollCells[k].className=cls;}
    }
  }
}
$("vel").onclick=function(){velMode=!velMode;store("gearboxVelMode",velMode?"1":null);dirty=true;draw();};
$("play").onclick=function(){var v=live.playing?0:1;live.playing=!!v;send("play "+v);dirty=true;draw();};
(function(){
  var f=$("fill");
  f.addEventListener("pointerdown",function(e){e.preventDefault();send("fill 1");});
  ["pointerup","pointercancel","pointerleave"].forEach(function(n){
    f.addEventListener(n,function(){send("fill 0");});
  });
})();

// ---------- Zeichnen (höchstens einmal pro Frame) ----------
function draw(){
  if(!dirty||draw.q)return;
  draw.q=true;
  requestAnimationFrame(function(){draw.q=false;dirty=false;render();});
}
function render(){
  $("play").textContent=live.playing?"Stop":"Play";
  $("play").classList.toggle("on",!!live.playing);
  $("bpm").textContent=live.bpm?Math.round(live.bpm*10)/10:"--";
  $("swing").textContent=(live.swing||0)+"%";
  $("fill").classList.toggle("on",!!live.fill);
  $("vel").classList.toggle("on",velMode);
  for(var p=0;p<8;p++){
    pb[p].classList.toggle("on",p===live.queued);
    pb[p].classList.toggle("r",!!live.playing&&live.pattern!==live.queued&&p===live.pattern);
  }
  if(!model)return;
  var maxLen=1,t,i;
  for(t=0;t<8;t++){var tt=curTrack(t);if(tt&&tt.length>maxLen)maxLen=tt.length;}
  var maxPage=Math.ceil(maxLen/16)-1;
  if(page>maxPage)page=maxPage;
  for(i=0;i<4;i++){pgb[i].disabled=i>maxPage;pgb[i].classList.toggle("on",i===page);}
  if(roll>=0&&!model.tracks[roll])roll=-1;
  if(!rollInit)buildRoll();
  $("grid").style.display=roll>=0?"none":"";
  $("roll").className=roll>=0?"show":"";
  if(roll>=0)renderRoll();
  for(t=0;t<8;t++){
    var tr=curTrack(t),info=model.tracks[t],row=rows[t];
    if(!tr)continue;
    row.nm.textContent=info.name;
    row.mb.classList.toggle("on",!!live.mutes[t]);
    row.sb.classList.toggle("on",!!info.solo);
    row.ln.textContent=tr.length;
    var cur=live.steps[t]!==undefined?live.steps[t]:-1;
    for(i=0;i<16;i++){
      var s=page*16+i,cls="c",txt="";
      if(s>=tr.length)cls+=" off";
      else{
        var ch=tr.steps.charAt(s);
        if(ch==="g"||ch==="x"||ch==="X")cls+=" "+ch;
        if(tr.ties.charAt(s)==="~")cls+=" t";
        if(live.playing&&live.pattern===live.queued&&s===cur)cls+=" cur";
        if(info.melody&&ch!=="."&&ch!==""){
          var ks=stepKeys(tr,s),lo=ks[0];
          for(var j=1;j<ks.length;j++)if(ks[j]<lo)lo=ks[j];
          txt=noteName((info.note||0)+lo)+(ks.length>1?"+"+(ks.length-1):"");
        }
      }
      var k=t*16+i;
      if(cellCache[k]!==cls+"|"+txt){cellCache[k]=cls+"|"+txt;cells[k].className=cls;cells[k].textContent=txt;}
    }
  }
}

// ---------- Start ----------
status(false);
pin=store("gearboxPin")||"";
if(/^\d{4}$/.test(pin))connect();else askPin("");
draw();dirty=true;draw();
</script>
